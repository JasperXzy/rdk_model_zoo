name: Deploy first208 evaluation report

on:
  workflow_dispatch:
  push:
    tags:
      - "web-v1.6.46"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-first208
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_ZOO_SAMPLE_REF: 7464cf18ea2fa96fd96866c042437cf3622c826f
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model_zoo_web/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: model_zoo_web/package-lock.json

      - name: Install catalog dependencies
        run: python -m pip install --disable-pip-version-check -r model_zoo_web/requirements.txt

      - name: Install website dependencies
        run: npm ci --prefix model_zoo_web

      - name: Build release website
        run: npm --prefix model_zoo_web run build:release

      - name: Validate release website
        run: npm --prefix model_zoo_web run check:release

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: model_zoo_web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
